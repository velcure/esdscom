name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  generator-binaries:
    name: generator binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build esdscom-gen
        env:
          CGO_ENABLED: "0"
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            ext=""; [ "$goos" = windows ] && ext=".exe"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -buildid=" \
              -o "dist/esdscom-gen_${TAG}_${goos}_${goarch}${ext}" ./cmd/esdscom-gen
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/esdscom-gen_*
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  go-proxy:
    name: announce to proxy.golang.org
    needs: release-please
    # The Go module proxy can only fetch public repositories.
    if: needs.release-please.outputs.release_created == 'true' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: fetch the new version through the proxy
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: curl -fsS "https://proxy.golang.org/github.com/velcure/esdscom/@v/${TAG}.info"
