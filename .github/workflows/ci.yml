name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  generate:
    name: generated code is current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go generate
        run: go generate ./...
      - name: go mod tidy
        run: go mod tidy
      - name: no differences
        run: git diff --exit-code

  xmllint:
    name: xmllint cross-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install xmllint
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxml2-utils
      - name: validate the test documents with xmllint
        run: |
          for f in testdata/valid/*.xml; do xmllint --noout --nonet --schema schema/v5.5/SDSComXML.xsd "$f"; done
          for f in testdata/invalid/*.xml; do
            if xmllint --noout --nonet --schema schema/v5.5/SDSComXML.xsd "$f" 2>/dev/null; then
              echo "$f is unexpectedly valid"; exit 1
            fi
          done
      - name: compare Validate and Encode with xmllint
        env:
          ESDSCOM_REQUIRE_XMLLINT: "1"
        run: go test -count=1 -run 'Xmllint|SchemaValid' -v .

  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: FuzzDecode for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 60s .

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install xmllint
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxml2-utils
      - name: go test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage report
        run: |
          {
            echo '## Coverage'
            echo
            echo '| | statements |'
            echo '|---|---|'
            echo "| all code | $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}') |"
            grep -v '_gen.go' coverage.out > handwritten.out
            echo "| without generated files | $(go tool cover -func=handwritten.out | tail -1 | awk '{print $NF}') |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  ci-success:
    name: CI success
    if: always()
    needs: [test, lint, generate, xmllint, fuzz, coverage]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job finished with: $r"; exit 1
            fi
          done
