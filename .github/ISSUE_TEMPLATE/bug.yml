name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here; see SECURITY.md.
        Remove personal data and confidential product data from documents you attach.
  - type: input
    id: version
    attributes:
      label: esdscom version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and OS
      placeholder: go1.26.9 linux/amd64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the error or the Validate findings.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal XML document or Go snippet.
      render: go
